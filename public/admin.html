<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Panel</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: Segoe UI, Tahoma, Geneva, Verdana, sans-serif; }
  body { background: #f4f5f7; color: #333; padding: 20px; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  .panel { background: #fff; border: 1px solid #ccc; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 20px; overflow: hidden; }
  .panel-head { background: #555; color: #fff; padding: 14px 20px; font-size: 18px; font-weight: bold; }
  .panel-sub { background: #f8f9fa; border-bottom: 1px solid #eee; padding: 10px 20px; font-weight: 600; color: #444; }
  .search { padding: 20px; display: flex; gap: 10px; }
  .search input { padding: 8px 12px; border: 1px solid #ccc; border-radius: 3px; font-size: 14px; }
  .form { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 20px; }
  .form label { font-size: 12px; color: #555; font-weight: 600; display: block; margin-bottom: 4px; }
  .form input { width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 3px; font-size: 13px; }
  button { background: #555; color: #fff; border: none; padding: 8px 16px; border-radius: 3px; cursor: pointer; font-size: 13px; font-weight: 600; }
  button:hover { background: #333; }
  button.danger { background: #d9534f; }
  button.danger:hover { background: #c9302c; }
  .actions { padding: 0 20px 20px; display: flex; gap: 10px; }
  .msg { padding: 0 20px 10px; font-weight: bold; font-size: 13px; }
  .tbl { padding: 0 20px 20px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
  th, td { padding: 10px; border: 1px solid #eee; text-align: left; }
  th { background: #f1f1f1; color: #333; font-weight: bold; }
  .hidden { display: none !important; }
  @media (max-width: 768px) { .form { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 480px) { .form { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">

  <div class="panel" id="loginBox">
    <div class="panel-head">Admin Login</div>
    <form class="search" id="lf">
      <input type="password" id="pw" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
    <div class="msg" id="lmsg"></div>
  </div>

  <div class="panel hidden" id="app">
    <div class="panel-head">Admin Panel</div>
    <div class="panel-sub">Add / Edit Vehicle Record (same VCC No = update)</div>
    <form id="rf">
      <div class="form" id="fields"></div>
      <div class="actions">
        <button type="submit">Save</button>
        <button type="button" id="clear">Clear</button>
        <button type="button" id="logout" style="margin-left:auto; background:#777;">Logout</button>
      </div>
    </form>
    <div class="msg" id="msg"></div>
    <div class="panel-sub">Records</div>
    <div class="tbl"><table>
      <thead><tr><th>VCC No</th><th>Chassis No</th><th>Brand</th><th>Model</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
  </div>
</div>

<script>
const F = [
  ['vccNo', 'VCC No *'],
  ['vccStatus', 'VCC Status'],
  ['vccGenerationDate', 'VCC Generation Date'],
  ['chassisNo', 'Chassis No'],
  ['engineNumber', 'Engine Number'],
  ['yearOfBuilt', 'Year of Built'],
  ['vehicleDrive', 'Vehicle Drive'],
  ['countryOfOrigin', 'Country of Origin'],
  ['engineCapacity', 'Engine Capacity'],
  ['carriageCapacity', 'Carriage Capacity'],
  ['passengerCapacity', 'Passenger Capacity'],
  ['vehicleModel', 'Vehicle Model'],
  ['vehicleBrandName', 'Vehicle Brand Name'],
  ['vehicleType', 'Vehicle Type'],
  ['vehicleColor', 'Vehicle Color'],
  ['specificationStandardName', 'Specification Standard Name'],
  ['declarationNumber', 'Declaration Number'],
  ['declarationDate', 'Declaration Date'],
  ['ownerCode', 'Owner Code'],
  ['ownerName', 'Owner Name'],
  ['printRemarks', 'Print Remarks']
];

const $ = id => document.getElementById(id);
let records = [];

$('fields').innerHTML = F.map(([k, l]) =>
  `<div><label for="f_${k}">${l}</label><input id="f_${k}" name="${k}"></div>`).join('');

async function api(url, opt) {
  const r = await fetch(url, opt);
  const d = await r.json().catch(() => ({}));
  if (r.status === 401 && url !== '/api/admin/login') showLogin();
  return { ok: r.ok, d };
}
function showLogin() { $('loginBox').classList.remove('hidden'); $('app').classList.add('hidden'); }
function showApp() { $('loginBox').classList.add('hidden'); $('app').classList.remove('hidden'); load(); }

async function load() {
  const { ok, d } = await api('/api/admin/records');
  if (!ok) return;
  records = d;
  const tb = $('rows'); tb.innerHTML = '';
  records.forEach(r => {
    const tr = document.createElement('tr');
    [r.vccNo, r.chassisNo, r.vehicleBrandName, r.vehicleModel, r.vccStatus].forEach(t => {
      const td = document.createElement('td'); td.textContent = t || ''; tr.appendChild(td);
    });
    const td = document.createElement('td');
    const e = document.createElement('button'); e.textContent = 'Edit'; e.onclick = () => fill(r);
    const x = document.createElement('button'); x.textContent = 'Delete'; x.className = 'danger'; x.style.marginLeft = '6px';
    x.onclick = () => del(r.vccNo);
    td.append(e, x); tr.appendChild(td); tb.appendChild(tr);
  });
}

function fill(r) { F.forEach(([k]) => $('f_' + k).value = r[k] || ''); window.scrollTo(0, 0); }
async function del(id) {
  if (!confirm('Delete ' + id + ' ?')) return;
  await api('/api/admin/records/' + encodeURIComponent(id), { method: 'DELETE' });
  load();
}

$('lf').addEventListener('submit', async e => {
  e.preventDefault();
  const { ok, d } = await api('/api/admin/login', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: $('pw').value })
  });
  if (ok) { $('pw').value = ''; showApp(); } else $('lmsg').textContent = d.error || 'Error';
});

$('rf').addEventListener('submit', async e => {
  e.preventDefault();
  const body = {}; F.forEach(([k]) => body[k] = $('f_' + k).value);
  const { ok, d } = await api('/api/admin/records', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
  });
  $('msg').style.color = ok ? '#2a7' : '#a33';
  $('msg').textContent = ok ? 'Saved' : (d.error || 'Error');
  if (ok) { $('rf').reset(); load(); }
});

$('clear').onclick = () => $('rf').reset();
$('logout').onclick = async () => { await api('/api/admin/logout', { method: 'POST' }); showLogin(); };

api('/api/admin/records').then(({ ok }) => { if (ok) showApp(); });
</script>
</body>
</html>
