<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vehicle Details</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; }
  body { background: #f5f5f5; color: #333; padding: 20px; font-size: 13px; }
  .wrap { max-width: 1000px; margin: 0 auto; background: #fff; border: 1px solid #ccc; border-radius: 4px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); overflow: hidden; }
  
  /* Header */
  .header { background: #555; color: #fff; padding: 14px 20px; font-size: 18px; font-weight: bold; }
  .subheader { background: #f0f0f0; border-bottom: 1px solid #ddd; padding: 10px 20px; font-weight: bold; color: #444; }
  
  /* Search Box */
  .search-section { padding: 20px; background: #fafafa; border-bottom: 1px solid #eee; display: flex; gap: 10px; align-items: center; }
  .search-section input { padding: 8px 12px; width: 300px; border: 1px solid #ccc; border-radius: 3px; font-size: 13px; outline: none; }
  .search-section button { background: #555; color: #fff; border: none; padding: 8px 18px; border-radius: 3px; cursor: pointer; font-weight: bold; }
  .search-section button:hover { background: #333; }
  
  /* Messages */
  .msg { padding: 15px 20px; color: #c9302c; font-weight: bold; }
  .hidden { display: none !important; }
  
  /* Details Grid Table (Two Columns Design) */
  .details-container { padding: 20px; }
  .details-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border: 1px solid #e0e0e0; }
  .field-row { display: flex; border-bottom: 1px solid #eee; min-height: 38px; align-items: center; }
  .field-row:nth-child(even) { background: #fdfdfd; }
  .field-label { width: 45%; padding: 8px 12px; font-weight: bold; color: #555; border-right: 1px solid #f0f0f0; background: #fafafa; }
  .field-value { width: 55%; padding: 8px 12px; color: #111; word-break: break-word; }
  
  /* Highlight VCC Status */
  .status-printed { color: #d9534f; font-weight: bold; }
  
  /* Footer */
  .footer { text-align: center; padding: 15px; background: #f9f9f9; border-top: 1px solid #eee; color: #777; font-size: 12px; }

  @media (max-width: 768px) {
    .details-grid { grid-template-columns: 1fr; }
    .search-section input { width: 100%; }
    .search-section { flex-direction: column; }
    .search-section button { width: 100%; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="header">View VCC Details</div>
  <div class="subheader">VCC/Vehicle Details</div>

  <!-- قسم البحث الرئيسي -->
  <div class="search-section" id="searchBox">
    <input type="text" id="q" placeholder="Enter Record No or Chassis No" autocomplete="off">
    <button type="button" id="searchBtn">Search</button>
  </div>

  <div class="msg hidden" id="msg"></div>

  <div class="details-container hidden" id="detailsBox">
    <div class="details-grid" id="grid"></div>
  </div>

  <div class="footer">
    &copy; Your Company Name
  </div>
</div>

<script>
const ROWS = [
  ['VCC No', 'vccNo', 'VCC Status', 'vccStatus'],
  ['VCC Generation Date', 'vccGenerationDate', 'Chassis No', 'chassisNo'],
  ['Engine Number', 'engineNumber', 'Year of Built', 'yearOfBuilt'],
  ['Vehicle Drive', 'vehicleDrive', 'Country of Origin', 'countryOfOrigin'],
  ['Engine Capacity', 'engineCapacity', 'Carriage Capacity', 'carriageCapacity'],
  ['Passenger Capacity', 'passengerCapacity', 'Vehicle Model', 'vehicleModel'],
  ['Vehicle Brand Name', 'vehicleBrandName', 'Vehicle Type', 'vehicleType'],
  ['Vehicle Color', 'vehicleColor', 'Specification Standard Name', 'specificationStandardName'],
  ['Declaration Number', 'declarationNumber', 'Declaration Date', 'declarationDate'],
  ['Owner Code', 'ownerCode', 'Owner Name', 'ownerName'],
  ['Print Remarks', 'printRemarks', '', '']
];

const $ = id => document.getElementById(id);

async function doSearch(queryText) {
  const q = queryText || $('q').value.trim();
  if (!q) {
    showMsg('الرجاء كتابة رقم السجل أو رقم الشاسيه');
    return;
  }
  
  $('msg').classList.add('hidden');
  $('detailsBox').classList.add('hidden');
  
  try {
    const r = await fetch('/api/record?q=' + encodeURIComponent(q));
    const d = await r.json();
    
    if (!r.ok) {
      showMsg(d.error || 'لا توجد بيانات مطابقة');
      return;
    }
    
    renderDetails(d);
  } catch (e) {
    showMsg('حدث خطأ أثناء الاتصال بالسيرفر');
  }
}

function renderDetails(data) {
  const g = $('grid');
  g.innerHTML = '';
  
  ROWS.forEach(([l1, k1, l2, k2]) => {
    // Left column
    const r1 = document.createElement('div');
    r1.className = 'field-row';
    const val1 = data[k1] || '';
    r1.innerHTML = `<div class="field-label">${l1}</div><div class="field-value">${val1}</div>`;
    g.appendChild(r1);

    // Right column
    if (l2) {
      const r2 = document.createElement('div');
      r2.className = 'field-row';
      let val2 = data[k2] || '';
      let extraClass = (k2 === 'vccStatus' && val2) ? 'status-printed' : '';
      r2.innerHTML = `<div class="field-label">${l2}</div><div class="field-value ${extraClass}">${val2}</div>`;
      g.appendChild(r2);
    } else {
      const r2 = document.createElement('div');
      r2.className = 'field-row';
      r2.innerHTML = `<div class="field-label"></div><div class="field-value"></div>`;
      g.appendChild(r2);
    }
  });

  // إخفاء صندوق البحث عند وجود البيانات
  $('searchBox').classList.add('hidden');
  $('detailsBox').classList.remove('hidden');
}

function showMsg(m) {
  $('msg').textContent = m;
  $('msg').classList.remove('hidden');
}

$('searchBtn').onclick = () => doSearch();
$('q').addEventListener('keypress', e => { if (e.key === 'Enter') doSearch(); });

// قراءة البرامترات بالتنسيق الجديد تلقائياً وإخفاء البحث
window.addEventListener('DOMContentLoaded', () => {
  const urlParams = new URLSearchParams(window.location.search);
  // قراءة value(vccNo) أو q
  const autoQuery = urlParams.get('value(vccNo)') || urlParams.get('q');
  if (autoQuery) {
    $('q').value = autoQuery;
    doSearch(autoQuery);
  }
});
</script>

</body>
</html>
